<!doctype html>
<html><head><meta charset="utf-8"><title>apps</title>
<style>
@font-face{font-family:Mr;font-weight:600;src:url(node_modules/@fontsource/manrope/files/manrope-latin-600-normal.woff2)}
@font-face{font-family:Mr;font-weight:700;src:url(node_modules/@fontsource/manrope/files/manrope-latin-700-normal.woff2)}
@font-face{font-family:Mr;font-weight:800;src:url(node_modules/@fontsource/manrope/files/manrope-latin-800-normal.woff2)}
@font-face{font-family:Lato;font-weight:400;src:url(node_modules/@fontsource/lato/files/lato-latin-400-normal.woff2)}
@font-face{font-family:Lato;font-weight:700;src:url(node_modules/@fontsource/lato/files/lato-latin-700-normal.woff2)}
@font-face{font-family:OS;font-weight:400;src:url(node_modules/@fontsource/open-sans/files/open-sans-latin-400-normal.woff2)}
@font-face{font-family:OS;font-weight:600;src:url(node_modules/@fontsource/open-sans/files/open-sans-latin-600-normal.woff2)}
@font-face{font-family:OS;font-weight:700;src:url(node_modules/@fontsource/open-sans/files/open-sans-latin-700-normal.woff2)}
:root{--y:#FFE14D;--plum:#4E3047}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#170C14;font-family:Mr,system-ui,sans-serif}
#bg{position:absolute;inset:0;background:radial-gradient(1400px 900px at 18% 20%,#4A2742 0%,#2A1626 45%,#170C14 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.33;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(120px,-80px) scale(1.15)}}
#bar{position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#EE3B33,#F15A4A 22%,#F7A541 45%,#FFE14D 60%,#F29A7A 78%,#E15AA5);z-index:50}
#logo{position:absolute;right:56px;top:40px;height:32px;z-index:50;transition:opacity .5s}
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transition:transform 1.2s cubic-bezier(.65,0,.25,1)}
#win{position:absolute;left:140px;top:84px;width:1640px;height:922px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);opacity:0;transform:translateY(30px) scale(.98);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1)}
#win.on{opacity:1;transform:none}
#demo{position:absolute;left:150px;top:1014px;font:600 13px Mr;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:45}
#spot{position:absolute;border-radius:10px;pointer-events:none;opacity:0;transition:all 1.2s cubic-bezier(.65,0,.25,1);z-index:30}
#spot.on{opacity:1;box-shadow:0 0 0 9999px rgba(20,10,18,.5),0 0 0 3px rgba(255,225,77,.95),0 0 30px 6px rgba(255,225,77,.35)}
#txt{position:absolute;inset:0;pointer-events:none;z-index:35}
.line{position:absolute;color:#fff;font-weight:700;opacity:0;transform:translateY(24px);transition:opacity .7s,transform .8s cubic-bezier(.2,.8,.2,1)}
.line.in{opacity:1;transform:none}.line.out{opacity:0;transform:translateY(-16px)}
.y{color:var(--y)}.big{font-size:150px;font-weight:800;line-height:1;letter-spacing:-.03em}.mid{font-size:44px;font-weight:600;line-height:1.25}
.src{font-size:17px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.hook{font-size:74px;font-weight:700;line-height:1.18}.kick{font-size:96px;font-weight:800;line-height:1.02;letter-spacing:-.02em}
#lower{position:absolute;left:56px;bottom:46px;background:#0E080C;padding:13px 24px 15px 20px;border-left:6px solid var(--y);opacity:0;transform:translateX(-30px);transition:all .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 12px 40px rgba(0,0,0,.45);z-index:40}
#lower.on{opacity:1;transform:none}
#lower .n{display:block;color:var(--y);font-size:15px;font-weight:800;letter-spacing:.2em}
#lower .t{display:block;color:#fff;font-size:32px;font-weight:700;margin-top:2px}
#lower .tl{display:flex;gap:8px;margin-top:8px}
#lower .tl span{display:inline-flex;align-items:center;gap:7px;background:#272027;color:#EDE6EC;font-size:15px;font-weight:600;padding:4px 10px 4px 8px;border-radius:6px}
#lower .tl i{width:14px;height:14px;border-radius:4px}
#badge{position:absolute;right:56px;top:40px;background:#111;color:#fff;font-weight:800;font-size:17px;letter-spacing:.14em;padding:8px 13px;border-radius:6px;opacity:0;transition:opacity .4s;z-index:51}
#badge.on{opacity:.92}#badge b{color:var(--y)}
#cursor{position:absolute;left:0;top:0;width:28px;height:28px;pointer-events:none;opacity:0;transition:left .9s cubic-bezier(.65,0,.25,1),top .9s cubic-bezier(.65,0,.25,1),opacity .3s;z-index:60}
#cursor.on{opacity:1}#cursor .ring{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid var(--y);opacity:0}
#cursor.click .ring{animation:ring .6s ease-out}@keyframes ring{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
#endcard{position:absolute;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;gap:120px;opacity:0;transition:opacity .9s;z-index:70}
#endcard.on{opacity:1}#endcard img{height:330px}#endcard div{font-size:62px;font-weight:700;color:var(--plum)}
/* shared app bits */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.ic{display:inline-block;width:18px;height:18px;border-radius:4px;background:currentColor;opacity:.75}
.new{animation:rowin .6s cubic-bezier(.2,.8,.2,1)}@keyframes rowin{from{opacity:0;transform:translateY(-8px);background:#FFF4CC}to{opacity:1;transform:none}}
.flash{animation:flash 1.6s ease}@keyframes flash{0%{background:#FFF4CC}100%{background:transparent}}
/* OpsRamp */
.or{font-family:OS,Inter,sans-serif;color:#1d2433;background:#F3F5F8}
.or .top{height:50px;background:#0B1F3A;color:#fff;display:flex;align-items:center;gap:26px;padding:0 20px;font-size:14px}
.or .top b{font-size:18px;letter-spacing:.01em}.or .top .nav{opacity:.8}.or .top .nav.on{opacity:1;border-bottom:3px solid #2BA4E0;padding:14px 0 11px}
.or .sub{height:52px;background:#fff;border-bottom:1px solid #DDE3EA;display:flex;align-items:center;gap:14px;padding:0 22px;font-size:14px}
.or .chip{border:1px solid #CBD3DD;border-radius:16px;padding:4px 12px;font-weight:600;font-size:13px}
.or table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.or th{text-align:left;font-weight:600;color:#5a6577;background:#F7F9FB;border-bottom:1px solid #DDE3EA;padding:9px 10px}
.or td{border-bottom:1px solid #EEF1F5;padding:9px 10px;white-space:nowrap}
.sev{display:inline-flex;align-items:center;gap:6px;font-weight:600}.sev i{width:10px;height:10px;border-radius:50%}
.or .inf{background:#FFF8E6}.or .inf td:first-child{border-left:4px solid #F59E0B}
.or .child td{color:#6a7486;background:#FBFCFD}.or .child td:nth-child(2){padding-left:34px}
.drawer{position:absolute;top:102px;right:0;bottom:0;width:640px;background:#fff;box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .6s cubic-bezier(.2,.8,.2,1);padding:20px 24px;overflow:hidden}
.drawer.on{transform:none}
/* ServiceNow */
.sn{font-family:Lato,Inter,sans-serif;color:#1F2933;background:#F1F3F5}
.sn .un{height:48px;background:#1B2B37;color:#fff;display:flex;align-items:center;gap:22px;padding:0 18px;font-size:14px}
.sn .un .pill{background:rgba(255,255,255,.12);border-radius:16px;padding:5px 14px;font-weight:700}
.sn .rail{width:54px;background:#fff;border-right:1px solid #DEE2E6;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:18px;color:#5A6872}
.sn .tabs{height:40px;background:#fff;border-bottom:1px solid #DEE2E6;display:flex;align-items:flex-end;gap:2px;padding-left:12px;font-size:13.5px}
.sn .tabs span{padding:9px 16px;border-radius:6px 6px 0 0;color:#5A6872}.sn .tabs span.on{background:#F1F3F5;color:#1F2933;font-weight:700;border:1px solid #DEE2E6;border-bottom:0}
.sn .btn{border:1px solid #9AA5B1;border-radius:6px;padding:7px 14px;font-weight:700;font-size:14px;background:#fff}
.sn .btn.p{background:#1B2B37;color:#fff;border-color:#1B2B37}
.sn .hl{display:flex;gap:0;background:#fff;border:1px solid #DEE2E6;border-radius:8px}
.sn .hl div{padding:10px 18px;border-right:1px solid #EEF0F2;font-size:13px;color:#5A6872}.sn .hl b{display:block;color:#1F2933;font-size:15px;margin-top:2px}
.sn .f{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.sn .f label{display:block;font-size:12.5px;color:#5A6872;margin-bottom:4px}.sn .f .v{border:1px solid #CDD3DA;border-radius:6px;padding:7px 10px;font-size:14px;background:#fff;min-height:34px}
.sn .act{background:#fff;border:1px solid #DEE2E6;border-radius:8px;display:flex;flex-direction:column}
.sn .note{border-top:1px solid #EEF0F2;padding:12px 16px;font-size:13.5px;line-height:1.5}
.sn .note .who{display:flex;align-items:center;gap:8px;font-weight:700}.sn .note .av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.sn .note .tag{font-size:11.5px;font-weight:700;color:#8A5300;background:#FFF1D6;border-radius:4px;padding:1px 6px}
/* Teams */
.tm{font-family:Inter,sans-serif;color:#242424;background:#F5F5F5}
.tm .tb{height:48px;background:#EBEBEB;display:flex;align-items:center;justify-content:center;position:relative;font-size:13px;color:#616161}
.tm .tb .s{width:520px;height:30px;border-radius:6px;background:#fff;border:1px solid #E0E0E0;display:flex;align-items:center;padding:0 12px}
.tm .ab{width:68px;background:#EBEBEB;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px;font-size:10.5px;color:#616161}
.tm .ab div{width:60px;padding:8px 0;border-radius:6px;text-align:center}.tm .ab div.on{background:#fff;color:#5B5FC7;font-weight:700}
.tm .ab i{display:block;width:22px;height:20px;margin:0 auto 3px;border-radius:5px;border:2px solid currentColor}
.tm .list{width:320px;background:#FAFAFA;border-right:1px solid #E0E0E0;padding:12px 10px;font-size:13.5px}
.tm .list .it{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:6px}.tm .list .it.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tm .av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.tm .mv{background:linear-gradient(135deg,#EE3B33,#F7A541 55%,#E15AA5)}
.tm .card{background:#fff;border:1px solid #E0E0E0;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.06);width:640px;font-size:14px}
.tm .card .hd{padding:14px 18px;border-bottom:1px solid #EDEBE9;font-weight:700;font-size:16px}
.tm .fact{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;padding:14px 18px;font-size:13.5px}.tm .fact span{color:#616161}
.tm .tbtn{border:1px solid #D1D1D1;border-radius:4px;padding:6px 16px;font-weight:600;font-size:13.5px;background:#fff}
.tm .tbtn.p{background:#5B5FC7;color:#fff;border-color:#5B5FC7}
/* Copilot Studio */
.cs{font-family:Inter,sans-serif;color:#242424;background:#FAF9F8}
.cs .hd{height:48px;background:#fff;border-bottom:1px solid #E1DFDD;display:flex;align-items:center;gap:16px;padding:0 18px;font-size:14px}
.cs .nav{width:56px;background:#F3F2F1;border-right:1px solid #E1DFDD;display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:16px;color:#605E5C}
.cs .tabs{display:flex;gap:26px;padding:0 24px;border-bottom:1px solid #E1DFDD;font-size:14px;background:#fff}
.cs .tabs span{padding:12px 0;color:#605E5C}.cs .tabs span.on{color:#242424;font-weight:600;border-bottom:3px solid #0F6CBD}
.cs .node{position:absolute;width:300px;background:#fff;border:1px solid #D1D1D1;border-radius:8px;padding:10px 12px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:border-color .4s,box-shadow .4s}
.cs .node .t{display:flex;align-items:center;gap:8px;font-weight:600}.cs .node .k{font-size:11.5px;color:#605E5C;margin-top:3px}
.cs .node .st{margin-left:auto;font-size:11.5px;font-weight:600;color:#8A8886}
.cs .node.run{border-color:#0F6CBD;box-shadow:0 0 0 3px rgba(15,108,189,.15)}.cs .node.run .st{color:#0F6CBD}
.cs .node.ok .st{color:#107C10}.cs .node .ti{width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex:none}
/* SD-WAN */
.sd{font-family:OS,Inter,sans-serif;color:#22303E;background:#F4F6F8}
.sd .hd{height:50px;background:#16324F;color:#fff;display:flex;align-items:center;gap:24px;padding:0 20px;font-size:14px}
.sd .nav{width:210px;background:#fff;border-right:1px solid #DCE2E8;padding:14px 0;font-size:14px}
.sd .nav div{padding:9px 20px;color:#4A5A6A}.sd .nav div.on{background:#E8F1FA;color:#16324F;font-weight:700;border-left:4px solid #2E7BD6}
.sd table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.sd th{text-align:left;color:#5A6A7A;font-weight:600;padding:10px;border-bottom:1px solid #DCE2E8;background:#F8FAFC}.sd td{padding:11px 10px;border-bottom:1px solid #EEF2F5;transition:background .6s,color .6s}
.st-b{display:inline-block;border-radius:4px;padding:2px 8px;font-weight:700;font-size:12px}
/* carrier portal */
.cp{font-family:Inter,sans-serif;color:#1E2430;background:#F6F7F9}
.cp .hd{height:56px;background:#2D3142;color:#fff;display:flex;align-items:center;gap:24px;padding:0 24px;font-size:14px}
/* ===== generic product page ===== */
.pg{font-family:var(--ff);color:#1f2328;background:var(--bg)}
.pg .top{height:48px;background:var(--top);color:var(--tfg);display:flex;align-items:center;gap:22px;padding:0 18px;font-size:14px;flex:none}
.pg .top .brand{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:10px}
.pg .top .brand i{width:22px;height:22px;border-radius:5px;background:var(--acc)}
.pg .top .tn{opacity:.82}.pg .top .tn.on{opacity:1;font-weight:700;box-shadow:inset 0 -3px var(--acc);padding:14px 0 13px}
.pg .top .srch{margin-left:auto;width:420px;height:30px;border-radius:5px;background:rgba(255,255,255,.12);display:flex;align-items:center;padding:0 12px;opacity:.8;font-size:13px}
.pg .top .usr{width:30px;height:30px;border-radius:50%;background:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.pg .side{width:var(--sw);background:var(--sbg);border-right:1px solid var(--line);padding:10px 0;font-size:13.5px;flex:none;overflow:hidden}
.pg .side div{padding:8px 16px;color:#424a53;white-space:nowrap;display:flex;align-items:center;gap:9px}
.pg .side div i{width:15px;height:15px;border-radius:3px;border:1.6px solid currentColor;opacity:.6;flex:none}
.pg .side div.on{background:var(--son);color:#111;font-weight:700;box-shadow:inset 3px 0 var(--acc)}
.pg .side .hdr{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a828c;padding-top:14px}
.pg .main{flex:1;display:flex;flex-direction:column;min-width:0;padding:16px 22px 18px;gap:12px;position:relative;overflow:hidden}
.pg .crumb{font-size:12.5px;color:#68707a}
.pg .ttl{display:flex;align-items:center;gap:12px}.pg .ttl h1{margin:0;font-size:23px;font-weight:700}
.pg .ttl .sub{font-size:13.5px;color:#58616b;margin-top:2px}
.pg .pl{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:3px 10px;font-size:12.5px;font-weight:700;transition:all .5s}
.pg .pl i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pg .acts{display:flex;gap:4px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;background:var(--abg)}
.pg .acts span{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:4px;font-size:13.5px;color:#24292f;transition:background .3s}
.pg .acts span i{width:14px;height:14px;border-radius:3px;border:1.6px solid var(--acc)}
.pg .acts span.hot{background:var(--hot);box-shadow:0 0 0 1px var(--acc) inset}
.pg .acts span.done{color:#1a7f37}
.pg .tabs2{display:flex;gap:24px;border-bottom:1px solid var(--line);font-size:14px;flex:none}
.pg .tabs2 span{padding:8px 0;color:#58616b}.pg .tabs2 span.on{color:#111;font-weight:700;box-shadow:inset 0 -3px var(--acc)}
.pg .grid{display:grid;gap:12px;flex:1;min-height:0;grid-auto-rows:minmax(0,auto);align-content:start}
.pg .blk{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;min-width:0;overflow:hidden;font-size:13.5px}
.pg .blk>.bt{font-weight:700;font-size:14.5px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.pg .kv{display:grid;grid-template-columns:var(--kw,150px) 1fr;gap:7px 12px}.pg .kv>span:nth-child(odd){color:#68707a}
.pg table.t{width:100%;border-collapse:collapse;font-size:13px}
.pg table.t th{text-align:left;color:#58616b;font-weight:600;padding:8px 9px;border-bottom:1px solid var(--line);background:var(--thb);white-space:nowrap}
.pg table.t td{padding:8px 9px;border-bottom:1px solid #eef0f3;white-space:nowrap;transition:background .6s,color .6s}
.pg table.t tr.sel td{background:var(--hot)}
.pg .tl>div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #f0f2f4;line-height:1.4}.pg .tl time{color:#68707a;font-variant-numeric:tabular-nums;flex:none;width:62px}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pg .fly{position:absolute;top:0;right:0;bottom:0;width:520px;background:#fff;box-shadow:-14px 0 40px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .55s cubic-bezier(.2,.8,.2,1);padding:22px 24px;display:flex;flex-direction:column;gap:12px;font-size:14px;z-index:5}
.pg .fly.on{transform:none}.pg .fly h3{margin:0;font-size:19px}
.pg .fly .fb{margin-top:auto;display:flex;gap:10px}
.pbtn{display:inline-block;border:1px solid #8c959f;border-radius:4px;padding:7px 16px;font-weight:600;font-size:13.5px;background:#fff}
.pbtn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.pg .mdl{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s;pointer-events:none;z-index:6}
.pg .mdl.on{opacity:1}.pg .mdl>div{width:560px;background:#fff;border-radius:6px;padding:20px 24px;font-size:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.pg .toast{position:absolute;right:22px;top:14px;background:#fff;border:1px solid var(--line);border-left:4px solid #1a7f37;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:11px 16px;font-size:13.5px;opacity:0;transform:translateY(-10px);transition:all .4s;z-index:7;max-width:520px}
.pg .toast.on{opacity:1;transform:none}
.inp{border:1px solid #c4cad1;border-radius:4px;padding:7px 10px;min-height:34px;background:#fff;font-size:14px}
.ai{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#8B2F6B;background:#FBE7F3;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.typing::after{content:"▍";animation:blink .8s steps(1) infinite;color:var(--acc)}@keyframes blink{50%{opacity:0}}
/* email */
.ol{font-family:Inter,sans-serif;background:#F5F5F5;color:#242424}
.ol .top{height:48px;background:#0F6CBD;color:#fff;display:flex;align-items:center;gap:18px;padding:0 18px;font-size:14px}
.ol .rib{height:44px;background:#fff;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;gap:6px;padding:0 14px;font-size:13.5px}

    $("#cstr", W()).innerHTML = `<div style="font-weight:600;margin-bottom:10px">Transcript</div><div style="background:#F3F2F1;border-radius:6px;padding:10px 12px;margin-bottom:10px"><div style="font-size:11.5px;color:#605E5C;margin-bottom:4px">Trigger payload · ${c.src}</div><code style="font-size:12px;white-space:pre">${c.payload}</code></div>`;
    const map = $("#csmap", W()), N = c.nodes, pos = (i) => [40 + (i % 2) * 340, 24 + i * (N.length > 10 ? 58 : 66)];
    let svg = `<svg style="position:absolute;inset:0" width="900" height="800">`; for (let i = 1; i < N.length; i++) { const [x1, y1] = pos(i - 1), [x2, y2] = pos(i); svg += `<path d="M${x1 + 150} ${y1 + 52} C ${x1 + 150} ${y1 + 62}, ${x2 + 150} ${y2 - 10}, ${x2 + 150} ${y2}" stroke="#C8C6C4" stroke-width="2" fill="none"/>`; } svg += `</svg>`;
    map.innerHTML = svg + N.map(([t, k, col, d], i) => { const [x, y] = pos(i); return `<div class="node" data-i="${i}" data-d="${d}" style="left:${x}px;top:${y}px"><div class="t"><span class="ti" style="background:${col}">${t[0]}</span>${t}<span class="st">Pending</span></div><div class="k">${k}</div></div>`; }).join("");
    return true;
  },
  csDet(i, title, sub, inp, out) {
    const det = $("#csdet", W()); const n = $(`.node[data-i="${i}"]`, W()); $$(".node", W()).forEach((x) => (x.style.outline = "")); n.style.outline = "2px solid #0F6CBD";
    det.innerHTML = `<div style="width:420px;padding:16px 18px;font-size:13.5px"><div style="font-weight:700;font-size:15px">${title}</div><div style="color:#605E5C;margin:2px 0 12px">${sub}</div><div style="font-weight:600;margin-bottom:6px">Inputs</div><pre style="background:#F3F2F1;border-radius:6px;padding:10px;font-size:12px;margin:0 0 12px;white-space:pre-wrap">${inp}</pre><div style="font-weight:600;margin-bottom:6px">Outputs</div><pre style="background:#F3F2F1;border-radius:6px;padding:10px;font-size:12px;margin:0;white-space:pre-wrap">${out}</pre><div style="margin-top:12px;color:#0F6CBD;font-weight:600">Show rationale</div></div>`;
    det.style.width = "420px"; return true;
  },

  // ================= Outlook (web) =================
  outlook(c) {
    W().innerHTML = `<div class="app ol"><div class="top"><b style="font-size:16px">Outlook</b><span style="margin-left:auto;width:520px;height:30px;border-radius:5px;background:rgba(255,255,255,.2);display:flex;align-items:center;padding:0 12px;font-size:13px">Search</span><span style="margin-left:auto" class="av"></span><span style="width:30px;height:30px;border-radius:50%;background:#C4314B;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">${c.me || "KS"}</span></div>
      <div class="rib">${["New mail", "Delete", "Archive", "Report", "Sweep", "Move to", "Reply", "Reply all", "Forward"].map((x) => `<span id="rb-${x.toLowerCase().replace(/ /g, "")}">${x}</span>`).join("")}</div>
      <div style="flex:1;display:flex;min-height:0"><div class="fold">${["Inbox", "Junk Email", "Drafts", "Sent Items", "Deleted Items", "Archive"].map((x) => `<div class="${x === "Inbox" ? "on" : ""}">${x}${x === "Inbox" ? ` <b style="float:right;color:#0F6CBD">${c.unread || 7}</b>` : ""}</div>`).join("")}</div>
      <div class="lst" id="ollst">${c.list.map(([f, s, p, t, on], i) => `<div class="m ${on ? "on" : ""}" id="olm${i}"><b>${f}<span style="float:right;font-weight:400;color:#616161;font-size:12px">${t}</span></b><div class="s">${s}</div><div class="p">${p}</div></div>`).join("")}</div>
      <div class="rd" id="olrd">${c.warn ? `<div class="warn">${c.warn}</div>` : ""}<div style="font-size:20px;font-weight:600;margin-bottom:12px">${c.open.subject}</div><div style="display:flex;gap:12px;align-items:center;margin-bottom:16px"><span style="width:40px;height:40px;border-radius:50%;background:${c.open.col || "#8764B8"};display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700">${c.open.init}</span><div><b>${c.open.from}</b><div style="font-size:12.5px;color:#616161">To: ${c.open.to}</div></div><span style="margin-left:auto;font-size:12.5px;color:#616161">${c.open.time}</span></div><div id="olbody">${c.open.body}</div></div></div></div>`;
    return true;
  }
};
</script></body></html>
